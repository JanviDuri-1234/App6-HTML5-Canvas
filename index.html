<script>
var docMod = document.lastModified; // loads last modified time stamp into docMod variable
alert("This file last modified " + docMod); // generates alert box with time stamp. If annoying, comment out this entire line.
console.log("This file last modified " + docMod); // generates a message in JavaScript console (found in developers tools) with time stamp. 

// This code draws a rectangle that is filled 
function draw_myCanvas(){ 
	var myCanvas_canvas = document.getElementById("myCanvas"): //This code finds the canvas element in the document object model.
	var myCanvas_context = myCanvas_canvas.getContext("2d"); //this code draws the context 
	myCanvas_context.fillRect( 30,30,200,150); // This code plots the rectangle at (30,30), and it has a width of 200 and a height of 150. 
}

// This code draws my name. 
function name_myCanvas (){ 
	var myCanvas_canvas = document.getElementById("myCanvas"); //This code finds canvas element in the document object model. 
	var myCanvas_context = myCanvas_canvas.getContext("2d"); //This code draws context. 
	myCanvas_context.dont = "30px Arial"; // This code sets the font size and style 
	myCanvas_context.fillText("Janvi Duri", 90,90); // This code draws my name at (90,90). 
} 

//This code adds an image of a sushi roll. 
	function image_myCanvas(){ 
		var myCanvas_canvas = document.getElementById("myCanvas"); //This code finds canvas element in the document object model 
		var myCanvas_context = myCanvas_canvas.getContext("2d"); //This code draws context. 
		var sushi = new Image(); //creates image object 
		sushi.src = "sushi.png"; //source of the image 
		sushi.onload = function () { 
			var targetWidth = sushi.width * 0.5; 
			var targetHeight = sushi.height * 0.5; 
		myCanvas_context.drawImage(sushi, 0.5, 0.5, targetWidth, targetHeight); 
		}; 
	}

// this code cleaers the canvas. 
	function clear_myCanvas(){ 
		var myCanvas_canvas = document.getElementById("myCanvas");// This code finds canvas element in the document object model 
		var myCanvas_context = myCanvas_canvas.getContext("2d"); //this code draws the context. 
		myCanvas_context.clearRect(0,0,500,500); // This canvas area of 500 by 500 is cleared. 
	}		

</script>

	<!-- This code makes a border on the canvas --> 
	<canvas id="myCanvas" width="300" height="400" style="border:1px solid #000000;" ></canvas>; <!--adds the canvas and the border --> 


	<br/> 
<div class ="button-container" id="one">  
<!-- This code creates a button that retrieves the rectangle fucntions when it is clicked --> 
	<a href="#one" onclick="draw_myCanvas()" class="w3-btn w3-black"> Rectangle </a>

<!-- This code creates a button and retrieves the name function when clicked. --> 
	<a href="#two" onclick="name_myCanvas()" class="w3-btn w3-black"> My Name </a>

<!-- This code creates a button and outputs the image function when clicked. --> 
<a href="#three" onclick="image_myCanvas()" class="w3-btn w3-black"> Sushi Image </a>

<!-- This code creates a button and outputs the clear function when clicked. -->
